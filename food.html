<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="css/food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="food/burgers.jpeg" alt="Burgers, fries and fried chicken" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers, fries and fried chicken"
          />
          Burgers and idk?</label
        >
      </div>
      <div class="food-item">
        <img src="food/dog.jpeg" alt="dog" />
        <label
          ><input type="checkbox" name="food" value="hotdog? :))" /> hotdog? :))</label
        >
      </div>
      <div class="food-item">
        <img src="food/koreanfood.jpeg" alt="Koreanfood" />
        <label
          ><input type="checkbox" name="food" value="Korean food maybe?" /> Korean
          food maybe?</label
        >
      </div>
      <div class="food-item">
        <img src="https://usercontent1.hubstatic.com/12244282_f520.jpg" alt="pasta" />
        <label><input type="checkbox" name="food" value="Street foods/cheap affordable things D)?" /> Street foods?/cheap affordable things D)</label>
      </div>
      <div class="food-item">
        <img src="https://th.bing.com/th/id/OIP.caUGn0QNE-FaInu7s1-zjQHaE6?rs=1&pid=ImgDetMain" alt="pizza" />
        <label><input type="checkbox" name="food" value="Donuts?" /> Donuts?</label>
      </div>
      <div class="food-item">
        <img src="food/salad.jpeg" alt="salad" />
        <label><input type="checkbox" name="food" value="Green stuff/Salad :(" /> Green stuff/Salad :(</label>
      </div>
      <div class="food-item">
        <img src="https://th.bing.com/th/id/OIP.VSTd2UlKdt3UPQH7S-jAnQAAAA?rs=1&pid=ImgDetMain" alt="steak" />
        <label><input type="checkbox" name="food" value="Takoyaki?" /> Takoyaki</label>
      </div>
      <div class="food-item">
        <img src="https://scontent.fceb3-1.fna.fbcdn.net/v/t39.30808-6/475149090_1685069302042394_5152001326545252150_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=a5f93a&_nc_eui2=AeHJMooQA78b0IypdKUaTW1eNGs2G-2Pya00azYb7Y_JrW8IEnrqOHF4IMhzGT-shpJkdgw7MSJla4S5q08LcGnp&_nc_ohc=G11TwBBcVMYQ7kNvgEhbocL&_nc_oc=AdgDBDY_HGTyJh_fVBhByNM-5CCmFsRV98dIYsX16IlqNcmdpfu34Aj8Fl1D5RUpYmg&_nc_zt=23&_nc_ht=scontent.fceb3-1.fna&_nc_gid=AwynFSofLMpshlOALYNU-qn&oh=00_AYCLnlpyTwXvBezS8cHxSqI__rx9-zD6sq11C7NtdZ2F5g&oe=67B28F41" alt="sushi" />
        <label><input type="checkbox" name="food" value="Me?" /> Me? :\</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue UWU
    </button>
  </body>
</html>
